name: secret-scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      range:
        description: 'Optional git range, e.g. abc123..def456. Leave empty for a full scan'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          chmod +x gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RANGE: ${{ inputs.range }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks detect --source . --log-opts="$BASE_SHA..$HEAD_SHA" --verbose --redact
          elif [ -n "$RANGE" ]; then
            ./gitleaks detect --source . --log-opts="$RANGE" --verbose --redact
          else
            ./gitleaks detect --source . --verbose --redact
          fi
